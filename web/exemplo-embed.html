<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secao secreta de jogos - Arkanoia</title>

<!--
  EXEMPLO de como embutir o Arkanoia numa pagina do projeto de ferramentas.
  Este arquivo NAO faz parte do build: copie o <style> e o bloco .arkanoia-frame
  para a pagina real da secao secreta.

  Pontos que importam:

  1. O jogo se adapta ao formato do container (16:9 no desktop, 9:16 no celular),
     entao basta dar a ele uma caixa com proporcao razoavel. O aspect-ratio muda
     em telas estreitas via media query.

  2. allow="autoplay" permite que o audio chiptune toque apos o primeiro clique
     do usuario (navegadores exigem interacao antes de liberar som).

  3. NAO use sandbox sem allow-scripts allow-same-origin: o Godot precisa de
     WebAssembly e de acesso ao IndexedDB (onde ficam o nick e o recorde local).
-->

<style>
	:root {
		--fundo: #0e0c16;
		--texto: #f4f4f8;
		--texto-fraco: #6a6488;
	}

	body {
		margin: 0;
		padding: 24px 16px;
		background: var(--fundo);
		color: var(--texto);
		font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 16px;
	}

	h1 {
		font-size: 1.1rem;
		font-weight: 600;
		letter-spacing: 0.08em;
		text-transform: uppercase;
		margin: 0;
	}

	p.aviso {
		margin: 0;
		font-size: 0.8rem;
		color: var(--texto-fraco);
		text-align: center;
		max-width: 46ch;
	}

	/* Caixa do jogo: proporcao paisagem no desktop. */
	.arkanoia-frame {
		width: 100%;
		max-width: 960px;
		aspect-ratio: 16 / 9;
		border: 1px solid #241e38;
		border-radius: 4px;
		overflow: hidden;
		background: var(--fundo);
	}

	.arkanoia-frame iframe {
		display: block;
		width: 100%;
		height: 100%;
		border: 0;
	}

	/* Em telas estreitas, vira retrato: o jogo reorganiza o layout sozinho. */
	@media (max-width: 700px) {
		.arkanoia-frame {
			aspect-ratio: 9 / 16;
			max-width: 480px;
		}
	}

	/* Telas muito baixas (notebook em janela pequena): evita corte vertical. */
	@media (min-width: 701px) and (max-height: 620px) {
		.arkanoia-frame {
			max-width: min(960px, 160vh);
		}
	}
</style>
</head>
<body>

<h1>Arkanoia</h1>

<div class="arkanoia-frame">
	<!-- Ajuste o src para onde o build foi publicado (ex.: /Arkanoia/). -->
	<iframe
		src="../docs/index.html"
		title="Arkanoia"
		allow="autoplay; fullscreen"
		loading="lazy"></iframe>
</div>

<p class="aviso">
	Mouse ou A/D movem a raquete &middot; clique lanca a bola &middot;
	P ativa o pause discreto &middot; M liga ou desliga o som
</p>

<!--
  ==========================================================================
   APONTAR PARA OUTRO PROJETO SUPABASE (opcional)
  ==========================================================================

  As credenciais de producao ja estao embutidas em src/core/supabase_config.gd.
  Para usar um projeto diferente (ex.: ambiente de homologacao) sem recompilar,
  cole o bloco abaixo no campo "Head Include" do preset de exportacao Web
  (Project > Export > Web > Options > HTML > Head Include).

  Precisa ser na pagina DO JOGO, nao nesta: o iframe e outro documento e nao
  enxerga variaveis definidas aqui.

	<script>
		window.ARKANOIA_SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
		window.ARKANOIA_SUPABASE_KEY = "sb_publishable_SUA_CHAVE";
	</script>

  Leaderboard._apply_web_overrides() le essas duas variaveis na inicializacao.
-->

</body>
</html>
